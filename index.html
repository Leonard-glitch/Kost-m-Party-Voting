<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/index.css">
    <title>Kostüm-Voting-App</title>
</head>
<body>

    <div id="connection-banner" role="status" aria-live="polite"></div>

    <h1 id="headerOne">🎭 Kostüm-Party 2026</h1>

    <main id="sec1">

        <div class="voteDiv">
            <h2>Wer hat das beste Kostüm?</h2>
            <p id="info-TextOne">Wähle deinen Favoriten aus.</p>

            <div id="kostuemTable">
                
            </div>

            <p id="vote-message" role="status"></p>
        </div>

        <p id="info-hint">Du kannst nur einmal von diesem Gerät aus abstimmen.</p>

        <div id="footer">
            <a href="./html/login.html" id="admin-link">Admin-Bereich</a>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBH_ZoTcpJcYzf_elI3mpSmmAwqbAjnf_o",
      authDomain: "kostparty-live-preview.firebaseapp.com",
      projectId: "kostparty-live-preview",
      storageBucket: "kostparty-live-preview.firebasestorage.app",
      messagingSenderId: "133490670261",
      appId: "1:133490670261:web:67f7823cd22871e0a8dcfc",
      measurementId: "G-LZJ22H1TZQ"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Offline-Persistenz: Falls eine Stimme wegen fehlender Verbindung nicht
    // sofort rausgeht, bleibt sie lokal (IndexedDB) gespeichert - auch über
    // einen Reload oder Tab-Schließen hinweg - und wird automatisch
    // nachgesendet, sobald wieder eine Verbindung besteht. Kann in
    // Ausnahmefällen fehlschlagen (z.B. sehr alter Browser); die App
    // funktioniert dann trotzdem normal weiter, nur ohne diesen Puffer.
    db.enablePersistence({ synchronizeTabs: true }).catch((err) => {
        console.warn("Offline-Persistenz nicht aktiv:", err.code);
    });
    </script>

    <script src="./js/index.js"></script>
</body>
</html>
