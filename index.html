<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/index.css">
    <title>Kostüm-Voting-App</title>
</head>
<body>

    <h1 id="headerOne">🎭 Kostüm-Party 2026</h1>

    <main id="sec1">

        <div class="voteDiv">
            <h2>Wer hat das beste Kostüm?</h2>
            <p id="info-TextOne">Trag die Nummer deines Favoriten ein, und stimme ab.</p>

            <label for="kostum-input" class="visually-hidden">Kostüm-Nummer</label>
            <input
                type="number"
                id="kostum-input"
                inputmode="numeric"
                min="1"
                max="200"
                placeholder="z. B. 42"
                autocomplete="off"
            >

            <p id="info-TextTwo">Gültige Nummern: <span id="valid-numbers"></span></p>

            <button id="vote-button" type="button">Abstimmen</button>

            <p id="vote-message" role="status"></p>
        </div>

        <p id="info-hint">Du kannst nur einmal von diesem Gerät aus abstimmen.</p>

        <div id="footer">
            <a href="./html/login.html" id="admin-link">Admin-Bereich</a>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>

</body>
</html>
